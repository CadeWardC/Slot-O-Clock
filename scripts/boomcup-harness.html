<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Boom Cup — visual harness</title>
    <style>
      body { background: #07060f; }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(380px, 1fr));
        gap: 18px;
        padding: 18px;
        align-items: start;
      }
      .phone-tag {
        margin: 0 0 6px;
        color: #9d92c4;
        font: 700 12px system-ui, sans-serif;
        letter-spacing: 0.04em;
      }
      .phone-screen {
        height: 760px;
        border: 2px solid #3b2d6e;
        border-radius: 26px;
        overflow: hidden;
        background: #0d0a1a;
      }
      .phone-screen .screen { height: 100%; min-height: 0; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./boomcup-harness.tsx"></script>
  </body>
</html>
